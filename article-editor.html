<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRIXO Article Editor</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --navy:#071a2f;
  --blue:#0b355c;
  --green:#19c37d;
  --bg:#f4f6f8;
  --white:#fff;
  --text:#111827;
  --muted:#64748b;
  --border:#e5e7eb;
  --red:#ef4444;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:235px;
  height:100vh;
  background:var(--navy);
  color:white;
  padding:20px 15px;
}

.logo{
  font-size:27px;
  font-weight:900;
  padding:10px;
  margin-bottom:25px;
}

.logo span{
  color:var(--green);
}

.menu-title{
  color:#94a3b8;
  font-size:10px;
  font-weight:bold;
  padding:0 10px;
  margin-bottom:10px;
}

.menu a{
  display:block;
  color:#cbd5e1;
  padding:12px 10px;
  border-radius:8px;
  margin-bottom:4px;
  font-size:13px;
  font-weight:bold;
  text-decoration:none;
}

.menu a:hover,
.menu a.active{
  background:var(--blue);
  color:white;
}

/* MAIN */

.main{
  margin-left:235px;
  padding:25px;
  max-width:1250px;
}

.topbar{
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.topbar h1{
  font-size:22px;
}

.back{
  color:#0b63ce;
  font-size:13px;
  font-weight:bold;
  text-decoration:none;
}

/* EDITOR */

.editor-layout{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  margin-top:20px;
}

.box{
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
}

.box-title{
  font-size:17px;
  font-weight:900;
  margin-bottom:18px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border);
}

.field{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
  outline:none;
  font-family:inherit;
  font-size:13px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--green);
}

textarea{
  min-height:280px;
  resize:vertical;
}

.excerpt{
  min-height:100px;
}

.slug{
  background:#f8fafc;
}

/* IMAGE */

.image-upload{
  border:2px dashed #cbd5e1;
  border-radius:10px;
  padding:25px 15px;
  text-align:center;
  color:var(--muted);
  cursor:pointer;
}

.image-upload:hover{
  border-color:var(--green);
}

.image-upload input{
  display:none;
}

.image-icon{
  font-size:35px;
  margin-bottom:8px;
}

/* OPTIONS */

.option{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.option:last-child{
  border-bottom:none;
}

.switch{
  width:42px;
  height:23px;
  position:relative;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#cbd5e1;
  border-radius:20px;
  cursor:pointer;
}

.slider:before{
  content:"";
  position:absolute;
  width:17px;
  height:17px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:var(--green);
}

.switch input:checked + .slider:before{
  transform:translateX(19px);
}

/* BUTTONS */

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.btn{
  border:none;
  border-radius:8px;
  padding:12px 18px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.btn-primary{
  background:var(--navy);
  color:white;
}

.btn-green{
  background:var(--green);
  color:white;
}

.btn-light{
  background:#f1f5f9;
  color:var(--text);
}

.btn:hover{
  opacity:.9;
}

/* SEO */

.seo-box{
  margin-top:20px;
}

.counter{
  text-align:right;
  color:#94a3b8;
  font-size:10px;
  margin-top:4px;
}

/* MOBILE */

@media(max-width:900px){

  .sidebar{
    width:65px;
    padding:15px 8px;
  }

  .logo{
    font-size:20px;
    padding:8px 4px;
  }

  .menu-title{
    display:none;
  }

  .menu a{
    font-size:0;
    text-align:center;
  }

  .main{
    margin-left:65px;
    padding:15px;
  }

  .editor-layout{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .main{
    padding:10px;
  }

  .topbar{
    gap:10px;
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

}
</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

  <div class="logo">
    CRI<span>XO</span>
  </div>

  <div class="menu-title">
    ADMIN PANEL
  </div>

  <div class="menu">

    <a href="admin.html">
      🏠 Dashboard
    </a>

    <a href="#" class="active">
      📰 Articles
    </a>

    <a href="article-editor.html">
      ➕ New Article
    </a>

    <a href="#">
      🏏 Matches
    </a>

    <a href="#">
      👥 Players
    </a>

    <a href="#">
      🏆 Series
    </a>

    <a href="#">
      ⚙️ Settings
    </a>

  </div>

</aside>


<!-- MAIN -->

<main class="main">

  <div class="topbar">

    <h1>
      Create Article
    </h1>

    <a href="admin.html" class="back">
      ← Dashboard
    </a>

  </div>


  <div class="editor-layout">


    <!-- ARTICLE -->

    <section class="box">

      <div class="box-title">
        Article Details
      </div>


      <div class="field">

        <label>
          Article Title
        </label>

        <input
          type="text"
          placeholder="Enter article title..."
        >

      </div>


      <div class="field">

        <label>
          URL Slug
        </label>

        <input
          class="slug"
          type="text"
          placeholder="article-url-slug"
        >

      </div>


      <div class="field">

        <label>
          Short Description
        </label>

        <textarea
          class="excerpt"
          placeholder="Write a short description..."
        ></textarea>

      </div>


      <div class="field">

        <label>
          Article Content
        </label>

        <textarea
          placeholder="Write your cricket article here..."
        ></textarea>

      </div>


      <div class="actions">

        <button class="btn btn-light" type="button">
          Save Draft
        </button>

        <button class="btn btn-green" type="button">
          Preview
        </button>

        <button class="btn btn-primary" type="button">
          Publish Article
        </button>

      </div>

    </section>


    <!-- SETTINGS -->

    <aside>


      <div class="box">

        <div class="box-title">
          Publishing
        </div>


        <div class="field">

          <label>
            Category
          </label>

          <select>

            <option>
              Cricket
            </option>

            <option>
              IPL
            </option>

            <option>
              India
            </option>

            <option>
              International
            </option>

            <option>
              Players
            </option>

            <option>
              Records
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Author
          </label>

          <input
            type="text"
            value="CRIXO"
          >

        </div>


        <div class="option">

          <span>
            Featured Article
          </span>

          <label class="switch">

            <input type="checkbox">

            <span class="slider"></span>

          </label>

        </div>


        <div class="option">

          <span>
            Allow Comments
          </span>

          <label class="switch">

            <input
              type="checkbox"
              checked
            >

            <span class="slider"></span>

          </label>

        </div>


      </div>


      <!-- IMAGE -->

      <div class="box" style="margin-top:20px;">

        <div class="box-title">
          Featured Image
        </div>


        <label class="image-upload">

          <input
            type="file"
            accept="image/*"
          >

          <div class="image-icon">
            🖼️
          </div>

          <strong>
            Upload Image
          </strong>

          <p>
            JPG, PNG or WEBP
          </p>

        </label>

      </div>


    </aside>


  </div>


  <!-- SEO -->

  <section class="box seo-box">

    <div class="box-title">
      🔎 SEO Settings
    </div>


    <div class="field">

      <label>
        Meta Title
      </label>

      <input
        type="text"
        maxlength="60"
        placeholder="SEO title..."
      >

      <div class="counter">
        Recommended: 50–60 characters
      </div>

    </div>


    <div class="field">

      <label>
        Meta Description
      </label>

      <textarea
        class="excerpt"
        maxlength="160"
        placeholder="SEO description..."
      ></textarea>

      <div class="counter">
        Recommended: 140–160 characters
      </div>

    </div>


    <div class="field">

      <label>
        SEO Keywords
      </label>

      <input
        type="text"
        placeholder="cricket news, IPL, cricket scores..."
      >

    </div>

  </section>


</main>

</body>
</html>
