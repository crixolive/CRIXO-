<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRIXO Article Editor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#111827;
}

header{
  background:#071a2f;
  color:white;
  padding:18px 20px;
}

header h1{
  margin:0;
  font-size:22px;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.field{
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #dbe1e8;
  border-radius:8px;
  font-size:14px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#19c37d;
}

textarea{
  min-height:250px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-weight:bold;
  cursor:pointer;
}

.publish{
  background:#19c37d;
  color:white;
}

.draft{
  background:#071a2f;
  color:white;
}

.logout{
  background:#ef4444;
  color:white;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  font-size:13px;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:650px){
  .row{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>CRIXO — Article Editor</h1>
</header>

<div class="container">

<div class="card">

<form id="articleForm">

<div class="field">
<label>Article Title</label>
<input
  id="title"
  type="text"
  placeholder="Enter article title"
  required
>
</div>

<div class="row">

<div class="field">
<label>Category</label>

<select id="category" required>
<option value="">Loading categories...</option>
</select>

</div>

<div class="field">
<label>Image URL</label>

<input
  id="image_url"
  type="url"
  placeholder="https://example.com/image.jpg"
>

</div>

</div>

<div class="field">
<label>Short Description</label>

<textarea
  id="excerpt"
  style="min-height:100px"
  placeholder="Write short description..."
></textarea>

</div>

<div class="field">
<label>Article Content</label>

<textarea
  id="content"
  placeholder="Write complete article..."
  required
></textarea>

</div>

<div class="row">

<div class="field">
<label>SEO Title</label>

<input
  id="seo_title"
  type="text"
  placeholder="SEO title"
>

</div>

<div class="field">
<label>SEO Description</label>

<input
  id="seo_description"
  type="text"
  placeholder="SEO description"
>

</div>

</div>

<div class="actions">

<button
  type="button"
  class="draft"
  onclick="saveArticle('draft')"
>
Save Draft
</button>

<button
  type="button"
  class="publish"
  onclick="saveArticle('published')"
>
Publish Article
</button>

<button
  type="button"
  class="logout"
  onclick="logoutAdmin()"
>
Logout
</button>

</div>

<div id="message" class="message"></div>

</form>

</div>
</div>

<script>

let currentUser = null;


// ================================
// CHECK ADMIN
// ================================

async function checkAdmin(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(!session){

    window.location.href="admin-login.html";
    return;

  }

  currentUser = session.user;

  const {data:profile,error} =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id",session.user.id)
      .single();

  if(error || !profile || profile.role !== "admin"){

    await supabaseClient.auth.signOut();

    window.location.href="admin-login.html";
    return;

  }

  loadCategories();

}


// ================================
// LOAD CATEGORIES
// ================================

async function loadCategories(){

  const select =
    document.getElementById("category");

  const {data,error} =
    await supabaseClient
      .from("categories")
      .select("id,name")
      .order("name");

  if(error){

    select.innerHTML =
      '<option value="">Unable to load categories</option>';

    console.error(error);

    return;

  }

  select.innerHTML =
    '<option value="">Select category</option>';

  data.forEach(category => {

    const option =
      document.createElement("option");

    option.value = category.id;
    option.textContent = category.name;

    select.appendChild(option);

  });

}


// ================================
// SAVE ARTICLE
// ================================

async function saveArticle(status){

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value;

  const image_url =
    document.getElementById("image_url").value.trim();

  const excerpt =
    document.getElementById("excerpt").value.trim();

  const content =
    document.getElementById("content").value.trim();

  const seo_title =
    document.getElementById("seo_title").value.trim();

  const seo_description =
    document.getElementById("seo_description").value.trim();


  if(!title){

    showMessage(
      "Please enter article title.",
      "error"
    );

    return;

  }


  if(!category){

    showMessage(
      "Please select a category.",
      "error"
    );

    return;

  }


  if(!content){

    showMessage(
      "Please write article content.",
      "error"
    );

    return;

  }


  const slug =
    title
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"");


  const article = {

    title:title,

    slug:slug,

    category_id:category,

    image_url:image_url || null,

    excerpt:excerpt || null,

    content:content,

    status:status,

    seo_title:seo_title || title,

    seo_description:
      seo_description || excerpt || null,

    author_id:currentUser.id

  };


  const {error} =
    await supabaseClient
      .from("articles")
      .insert(article);


  if(error){

    console.error(error);

    showMessage(
      "Article save failed: " + error.message,
      "error"
    );

    return;

  }


  showMessage(
    status === "published"
      ? "✅ Article published successfully!"
      : "✅ Article saved as draft!",
    "success"
  );


  document.getElementById("articleForm").reset();

}


// ================================
// MESSAGE
// ================================

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

}


// ================================
// LOGOUT
// ================================

async function logoutAdmin(){

  await supabaseClient.auth.signOut();

  window.location.href="admin-login.html";

}


// START
checkAdmin();

</script>

</body>
</html>
