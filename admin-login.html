<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRIXO Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#071a2f,#0b355c);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#fff;
  border-radius:18px;
  padding:30px 25px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  color:#071a2f;
}

.logo span{
  color:#19c37d;
}

.subtitle{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin:6px 0 25px;
}

.security{
  background:#f0fdf4;
  color:#166534;
  border:1px solid #bbf7d0;
  border-radius:9px;
  padding:10px;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  margin-bottom:20px;
}

.field{
  margin-bottom:17px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
  color:#111827;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #e5e7eb;
  border-radius:8px;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#19c37d;
}

button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:8px;
  background:#071a2f;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  font-size:12px;
  text-align:center;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#64748b;
  font-size:12px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    CRI<span>XO</span>
  </div>

  <div class="subtitle">
    Secure Administration Panel
  </div>

  <div class="security">
    🔒 ADMIN ACCESS ONLY
  </div>

  <form id="loginForm">

    <div class="field">
      <label for="email">Admin Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter admin email"
        required
      >
    </div>

    <div class="field">
      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        required
      >
    </div>

    <button id="loginButton" type="submit">
      Sign In
    </button>

  </form>

  <div id="message" class="message"></div>

  <a href="index.html" class="back">
    ← Back to CRIXO
  </a>

</div>

<script>

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text,type){

  message.textContent = text;
  message.className = "message " + type;

}

form.addEventListener("submit", async function(e){

  e.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Signing in...";

  try{

    const {data,error} =
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });

    if(error){
      throw error;
    }

    if(!data.user){
      throw new Error("Login failed.");
    }

    const {data:profile,error:profileError} =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id",data.user.id)
        .single();

    if(profileError || !profile){
      await supabaseClient.auth.signOut();
      throw new Error("Admin profile not found.");
    }

    if(profile.role !== "admin"){
      await supabaseClient.auth.signOut();
      throw new Error("You are not an admin.");
    }

    showMessage(
      "Login successful! Opening dashboard...",
      "success"
    );

    setTimeout(function(){
      window.location.href="admin.html";
    },700);

  }catch(error){

    showMessage(
      error.message || "Login failed.",
      "error"
    );

    button.disabled=false;
    button.textContent="Sign In";
  }

});

</script>

</body>
</html>
