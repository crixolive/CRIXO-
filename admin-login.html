<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRIXO Admin Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#071a2f,#0b355c);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:#fff;
  border-radius:18px;
  padding:30px 25px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  color:#071a2f;
  margin-bottom:5px;
}

.logo span{
  color:#19c37d;
}

.subtitle{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin-bottom:28px;
}

.security{
  background:#f0fdf4;
  color:#166534;
  border:1px solid #bbf7d0;
  border-radius:9px;
  padding:10px;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  margin-bottom:20px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
  color:#111827;
}

.input-group{
  margin-bottom:17px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #e5e7eb;
  border-radius:8px;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#19c37d;
}

button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:8px;
  background:#071a2f;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0b355c;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#64748b;
  font-size:12px;
  text-decoration:none;
}

.note{
  margin-top:22px;
  text-align:center;
  color:#94a3b8;
  font-size:10px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    CRI<span>XO</span>
  </div>

  <div class="subtitle">
    Secure Administration Panel
  </div>

  <div class="security">
    🔒 ADMIN ACCESS ONLY
  </div>

  <form>

    <div class="input-group">

      <label for="email">
        Admin Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="admin@example.com"
        required
      >

    </div>


    <div class="input-group">

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        required
      >

    </div>


    <button type="submit">
      Sign In
    </button>

  </form>


  <a href="index.html" class="back">
    ← Back to CRIXO
  </a>


  <div class="note">
    This is the login interface only.
    Real authentication will be connected
    using a secure authentication service.
  </div>

</div>

</body>
</html>
